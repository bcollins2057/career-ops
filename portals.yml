    - "montreal"
    - "vancouver"
    - "ottawa"

# -- Salary filter --
# Roles with a disclosed salary range entirely outside [min, max] are skipped.
# Roles with no disclosed salary always pass — don't penalize missing data.

salary_filter:
  min: 60000
  max: 140000
  currency: USD

