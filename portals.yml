# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Systems Engineer --
    - "Systems Engineer"
    - "Infrastructure Engineer"
    - "Network Engineer"
    - "Network Administrator"
    - "Cloud Engineer"
    - "Platform Engineer"
    - "Site Reliability"
    - "SRE"
    - "DevOps Engineer"
    - "IT Engineer"
    # -- Systems Administrator --
    - "Systems Administrator"
    - "Sysadmin"
    - "System Administrator"
    - "Windows Administrator"
    - "Linux Administrator"
    - "Server Administrator"
    - "IT Administrator"
    - "Active Directory"
    - "Infrastructure Administrator"
    # -- Help Desk / IT Support --
    - "Help Desk"
    - "Helpdesk"
    - "IT Support"
    - "IT Technician"
    - "Desktop Support"
    - "Service Desk"
    - "IT Specialist"
    - "Technical Support"
    - "End User Support"
    - "Field Technician"
    - "IT Analyst"
    - "Support Technician"
    - "Support Specialist"
    - "IT Coordinator"
    # -- Broad IT --
    - "IT Operations"
    - "IT Infrastructure"
    - "NOC Technician"
    - "NOC Engineer"
    - "Endpoint Management"
    - "Identity and Access"
    - "IAM"
  negative:
    - "Intern"
    - "University Graduate"
    - "Software Engineer"
    - "Software Developer"
    - "Data Engineer"
    - "Machine Learning"
    - "AI Engineer"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP Basis"
    - "Mainframe"
    - "COBOL"
    - "Salesforce Administrator"
    - "Sales Engineer"
    - "Customer Success"
    - "Account Executive"
    - "Marketing"
    - "Manager,"
    - "Manager II"
    - "Manager I,"
    - "Director,"
    - "Director "
    - "Vice President"
    - "VP,"
    - "Site Reliability"
    - "SRE"
    - "Platform Engineer"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Staff"
    - "Tier 2"
    - "Tier 3"
    - "Level II"
    - "Level III"

# -- Location filter --
# always_allow: location strings that always pass (even if they'd match a block keyword)
# block: location strings that auto-reject the posting
# If location is blank/unknown, the posting always passes (don't penalize missing data).

location_filter:
  always_allow:
    - "remote"
    - "colorado"
    - "denver"
    - "boulder"
    - "colorado springs"
    - "aurora"
    - "fort collins"
    - "broomfield"
