# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.

search_queries:
  # -- Greenhouse --
  - name: Greenhouse — Systems Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Systems Engineer" OR "Infrastructure Engineer" OR "Network Engineer" remote'
    enabled: true

  - name: Greenhouse — Sysadmin
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Systems Administrator" OR "Sysadmin" OR "IT Administrator" remote'
    enabled: true

  - name: Greenhouse — Help Desk & IT Support
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Help Desk" OR "IT Support" OR "Desktop Support" OR "Service Desk" OR "Support Specialist" remote'
    enabled: true

  # -- Lever --
  - name: Lever — Systems Engineer & Sysadmin
    query: 'site:jobs.lever.co "Systems Engineer" OR "Systems Administrator" OR "Infrastructure Engineer" remote'
    enabled: true

  - name: Lever — Help Desk & IT Support
    query: 'site:jobs.lever.co "Help Desk" OR "IT Support" OR "Desktop Support" OR "IT Technician" OR "Service Desk" remote'
    enabled: true

  # -- Ashby --
  - name: Ashby — Sysadmin & IT Support
    query: 'site:jobs.ashbyhq.com "Systems Administrator" OR "IT Administrator" OR "IT Support" OR "Help Desk" OR "Service Desk" remote'
    enabled: true

  - name: Ashby — Systems Engineer & Infrastructure
    query: 'site:jobs.ashbyhq.com "Systems Engineer" OR "Infrastructure Engineer" OR "IT Specialist" OR "Technical Support" remote'
    enabled: true

  # -- Workable --
  - name: Workable — IT Support & Sysadmin
    query: 'site:apply.workable.com "Help Desk" OR "IT Support" OR "Systems Administrator" OR "Systems Engineer" OR "Service Desk" remote'
    enabled: true

  # -- Himalayas (remote-first aggregator) --
  - name: Himalayas — IT Support & Sysadmin
    query: 'site:himalayas.app "Systems Administrator" OR "Help Desk" OR "IT Support" OR "Service Desk" OR "Desktop Support"'
    enabled: true

  - name: Himalayas — Systems Engineer & Infrastructure
    query: 'site:himalayas.app "Systems Engineer" OR "Infrastructure Engineer" OR "IT Specialist" OR "Technical Support Specialist"'
    enabled: true

  # -- BuiltIn (tech company job board) --
  - name: BuiltIn — IT Support & Sysadmin (Remote)
    query: 'site:builtin.com "Systems Administrator" OR "IT Support" OR "Help Desk" OR "Desktop Support" OR "Service Desk" remote'
    enabled: true

  - name: BuiltIn — Systems Engineer (Remote)
    query: 'site:builtin.com "Systems Engineer" OR "Infrastructure Engineer" OR "IT Specialist" remote'
    enabled: true

  # -- Dice (tech-focused job board) --
  - name: Dice — Sysadmin & IT Support (Remote)
    query: 'site:dice.com "Systems Administrator" OR "Help Desk" OR "IT Support" OR "Desktop Support" remote'
    enabled: true

  - name: Dice — Systems Engineer (Remote)
    query: 'site:dice.com "Systems Engineer" OR "Infrastructure Engineer" OR "Network Administrator" remote'
    enabled: true

  # -- Remote-specific boards --
  - name: Remote.co — IT & Sysadmin
    query: 'site:remote.co "Systems Administrator" OR "Help Desk" OR "IT Support" OR "Desktop Support"'
    enabled: true

  - name: FlexJobs — Remote IT Support
    query: 'site:flexjobs.com "Help Desk" OR "IT Support" OR "Systems Administrator" OR "Desktop Support" remote'
    enabled: true

  # -- Indeed --
  - name: Indeed — Remote Sysadmin & IT Support
    query: 'site:indeed.com "Systems Administrator" OR "IT Support" OR "Help Desk" OR "Service Desk" "remote" -"on-site" -"on site"'
    enabled: true

  - name: Indeed — Remote Systems & Infrastructure Engineer
    query: 'site:indeed.com "Systems Engineer" OR "Infrastructure Engineer" OR "Network Administrator" "remote" -"on-site" -"on site"'
    enabled: true

  # -- ZipRecruiter --
  - name: ZipRecruiter — Remote Sysadmin & IT Support
    query: 'site:ziprecruiter.com "Systems Administrator" OR "IT Support" OR "Help Desk" OR "Service Desk" remote'
    enabled: true

  - name: ZipRecruiter — Remote Systems Engineer
    query: 'site:ziprecruiter.com "Systems Engineer" OR "Infrastructure Engineer" OR "Network Engineer" remote'
    enabled: true

  # -- SimplyHired --
  - name: SimplyHired — Remote IT Support & Sysadmin
    query: 'site:simplyhired.com "Systems Administrator" OR "Help Desk" OR "IT Support" OR "Service Desk" remote'
    enabled: true

  # -- Monster --
  - name: Monster — Remote Sysadmin & IT Support
    query: 'site:monster.com "Systems Administrator" OR "Help Desk" OR "IT Support" OR "Desktop Support" remote'
    enabled: true

  # -- Wellfound (AngelList) — startup IT roles --
  - name: Wellfound — Remote IT & Infrastructure
    query: 'site:wellfound.com "Systems Administrator" OR "IT Support" OR "Help Desk" OR "Infrastructure Engineer" remote'
    enabled: true

  # -- USAJobs — federal remote IT --
  - name: USAJobs — Remote IT & Sysadmin
    query: 'site:usajobs.gov "Systems Administrator" OR "IT Specialist" OR "Network Administrator" OR "Help Desk" remote'
    enabled: true

  # -- ClearanceJobs — cleared IT roles --
  - name: ClearanceJobs — Remote Sysadmin & IT Support
    query: 'site:clearancejobs.com "Systems Administrator" OR "Help Desk" OR "Network Administrator" OR "IT Support" remote'
    enabled: true
    notes: "Requires/prefers security clearance — useful if candidate holds or is pursuing clearance"

  # -- Cyberseek / security-adjacent --
  - name: Broad — Remote NOC & Network Admin
    query: '"NOC Technician" OR "NOC Engineer" OR "Network Administrator" OR "Network Operations" remote -site:linkedin.com'
    enabled: true

  # -- Broad searches --
  - name: Broad — Sysadmin Remote US
    query: '"Systems Administrator" OR "Sysadmin" "Active Directory" OR "Azure AD" OR "Microsoft 365" remote "United States" -site:linkedin.com'
    enabled: true

  - name: Broad — Help Desk Remote US
    query: '"Help Desk" OR "Service Desk" OR "IT Support Specialist" "remote" "United States" "PowerShell" OR "Active Directory" OR "Microsoft 365" -site:linkedin.com'
    enabled: true

  - name: Broad — WFH IT Support (explicit)
    query: '"work from home" OR "WFH" OR "100% remote" "Help Desk" OR "IT Support" OR "Service Desk" OR "Systems Administrator" "United States" -site:linkedin.com'
    enabled: true

  - name: Broad — Colorado IT On-site
    query: '"Systems Administrator" OR "Help Desk" OR "IT Support" OR "Desktop Support" OR "IT Analyst" Colorado "Denver" OR "Boulder" OR "Colorado Springs" OR "Aurora" -site:linkedin.com'
    enabled: true

  - name: Broad — MSP Remote Sysadmin
    query: '"managed service" OR "MSP" "Systems Administrator" OR "Help Desk" OR "IT Support" remote "United States" -site:linkedin.com'
    enabled: true

